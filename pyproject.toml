[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "min-agent"
version = "0.1.0"
description = "Autopoiesis: a self-evolving LLM paper-trading agent that grades its own strategies against broker evidence and retires the ones that do not earn their place."
readme = "README.md"
requires-python = ">=3.10"
# The table form, not the PEP 639 SPDX string `license = "Apache-2.0"`. That is the
# modern spelling and it is what a reader expects, but it needs setuptools>=77; this
# file declares `setuptools>=68` as its floor, and 68.1.2 rejects the string form with
# `ValueError: required: ['text']`. Verified by reading the config with the floor
# version rather than by assuming - raising the floor to chase the newer spelling would
# make the documented fresh-clone install depend on a newer setuptools for no gain.
license = { text = "Apache-2.0" }

# The complete runtime dependency set. Three packages, all reachable by importing the
# package: `alpaca_trade_api` in data_gateway/executor/cli/broker_evidence,
# `pydantic` in models.py, `requests` in the three Alpaca call sites that use it
# directly. There is no implicit dependency, no vendored copy and no import of a
# stdlib-adjacent backport - this list was derived by scanning every `import` in
# src/min_agent rather than by reading an existing manifest, because there wasn't one.
dependencies = [
    "alpaca-trade-api>=3.2,<4",
    "pydantic>=2.9,<3",
    "requests>=2.31,<3",
]

authors = [{ name = "QuantGroup contributors" }]
keywords = ["trading", "paper-trading", "llm", "agent", "self-improving", "alpaca", "backtest"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Office/Business :: Financial :: Investment",
]

[project.urls]
Homepage = "https://github.com/liuyime2/autopoiesis"
Repository = "https://github.com/liuyime2/autopoiesis"
Issues = "https://github.com/liuyime2/autopoiesis/issues"
Changelog = "https://github.com/liuyime2/autopoiesis/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    # `make lint` and `make type` invoke these by module name. They were missing here
    # while being present in the project environment, so a fresh `make install` produced
    # an environment where the documented `make check` failed with "No module named
    # ruff" - found by actually cloning and installing rather than by reading pyproject.
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
# The single canonical entry point. Every operational task is a subcommand here;
# the Makefile delegates to this rather than reimplementing any of it.
min-agent = "min_agent.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
# research/ is a deliberate quarantine: diagnosis, never execution. It ships with the
# package because `tools/verify.py` scans it and the tests exercise it, but
# check_production_research_separation() fails the build if production imports it.
include = ["min_agent*"]

[tool.mypy]
python_version = "3.10"
# Third-party stubs for the Alpaca client do not exist and the client is thin; the
# agent's own model layer is where type errors actually matter.
ignore_missing_imports = true
# The codebase uses `from __future__ import annotations` throughout and relies on
# forward references inside pydantic models.
follow_imports = "silent"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
# Not enabled deliberately: `disallow_untyped_defs`. Turning it on would report every
# function in the codebase, and the useful signal - an annotation that contradicts the
# code - comes from the checks below. Enabling it would be a large diff that hides the
# few real findings among hundreds of mechanical ones.
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
