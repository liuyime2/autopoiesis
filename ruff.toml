# Lint and type-check configuration.
#
# Both tools are already present in the project environment; this file makes their
# settings explicit and reproducible rather than relying on defaults, which differed
# between the versions a given developer happened to have.
#
# The ruleset is chosen to match what this codebase actually does, not to assert a
# house style it does not follow. `BLE001` (blind `except`) is deliberately excluded:
# the daemon is designed to catch broadly and record the failure in the journal rather
# than die mid-cycle, which is a correctness property here, not an oversight. Enabling
# it would have produced 61 findings, all of them intentional.


line-length = 110
target-version = "py310"
src = ["src", "tests", "tools"]
# research/ is a research-only tree under the same gate as the rest of the package;
# it is linted because it ships, not skipped because it is quarantined.

[lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes: undefined names, unused imports - real dead code
    "W",    # pycodestyle warnings
    "I",    # isort: unsorted imports make diffs noisy
    "UP",   # pyupgrade: modern syntax, fewer words to read
    "B",    # bugbear: real bug patterns
    "SIM",  # simplify: readability without behaviour change
    "RET",  # return consistency
    "ARG",  # unused arguments
    "C4",   # comprehensions
    "PIE",  # misc lints
    "RUF",  # ruff-specific correctness rules
]
ignore = [
    # The daemon catches broadly on purpose: a maintenance failure must be journaled
    # and survive, not crash the process and take the paper run down with it. Each of
    # these 61 sites record what failed (see `_agent_holding_errors`,
    # `_maintenance`'s try/except, the doctor's per-check isolation).
    "BLE001",
    # Long lines in the strategy-library lookup tables are data, not logic; reflowing
    # them would make the tables harder to scan, not easier.
    "E501",
    # `assert` in verification tooling is the assertion mechanism, not a test-only
    # construct.
    "S101",
    # Type annotations on internal helpers are selectively present by design; requiring
    # them everywhere would mean annotating rather than simplifying.
    "ANN",
    # Deep nesting is present in the reconciliation and lifecycle review paths where the
    # early-return ordering is the logic; flattening them would obscure it.
    "PLR0912",
    "PLR0915",
    # `atomicio` opens a NamedTemporaryFile with delete=False on purpose - the point is
    # to write to one filesystem and then os.replace() into place - and closes it in a
    # `with` immediately after. Both findings below are the rule not accounting for that.
    "SIM115",
    # `try/except OSError: pass` where the intent is "the file simply is not there yet".
    # contextlib.suppress says the same thing in more characters.
    "SIM105",
    # `cli.py` imports inside functions so that `--help` and the cheap subcommands do not
    # pay for the 24 modules the daemon path needs. E402 is the wrong rule for deferred
    # imports that are the entire point of the module.
    "E402",
    # Single-letter loop and lambda names in `tools/verify.py` (`for l in lines`,
    # `lambda r: ...`). That file is long - thousands of lines - and reads as a list of and reads as a list of
    # independent assertions; one-letter names there are local and unambiguous. The
    # readability cost of renaming them exceeds the gain.
    "E741",
    # Unused lambda parameters are how a single-implementation interface is declared
    # (`lambda self, snapshot: ...`). Renaming to `_self` would not make the code clearer.
    "ARG005",
    "ARG001",
    # RUF012 wants ClassVar on class-level mutable defaults. These are configuration
    # constants on pydantic models, not per-instance state.
    "RUF012",
    # Nested `if` in the risk gates. Each is a distinct rule with its own refusal
    # reason; collapsing them into one condition would put two rules on one line and
    # make the list of limits harder to read, which is the opposite of the intent.
    "SIM102",
    # `doctor` compares sys.version_info against the 3.10 floor declared in
    # pyproject.toml. ruff considers the check redundant because requires-python
    # already enforces it; the check is kept because an interpreter can be selected
    # without any install step (PYTHONPATH, or activating an env directly), and then
    # nothing but doctor reports the mismatch.
    "UP036",
    # `strategy_engine` groups duplicate strategies by signature and then iterates the
    # groups. The key is unused inside the body because the group members carry the
    # identity; renaming it `_signature` would obscure that it is a grouping key.
    "B007",
]

[lint.per-file-ignores]
# Test fixtures legitimately import names to patch them, and assert on them.
"tests/*" = ["ARG001", "ARG002", "F401", "F811", "S101", "SLF001", "PT011", "B011",
               "B017", "F841", "SIM102", "B018", "C408", "RUF005", "PIE810", "B007"]
# verify.py builds regexes and parses ASTs; its own imports are exercised dynamically.
# verify.py is thousands of lines of independent check classes, each a short block that
# reads top to bottom. The remaining findings there are readability preferences
# (collapsible ifs, list() over [x for x in y], percent vs format) that would make
# a diff across 39 sites for no behavioural gain. Correctness rules - F for
# undefined names and unused imports, B for real bug patterns - stay enabled.
"tools/verify.py" = ["S101", "F401", "C4", "C416", "SIM102", "UP031", "PIE810", "RUF005", "RUF059", "B007", "B017", "B018"]

[lint.isort]
known-first-party = ["min_agent"]
