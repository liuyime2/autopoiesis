# Runs the same gate a developer runs locally, on every push and pull request.
#
# Deliberately not a superset of `make verify`. The broker-dependent targets need
# credentials and a paper account, so they are not in CI; `make smoke-offline` is the
# broadest check that runs without either, and it is included. The credentialed path is
# covered by the unattended watchdog on the deployment host, not here.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: lint
        run: ruff check src/ tools/ tests/

      - name: unit and integration tests
        run: python -m pytest -q

      - name: offline smoke (no broker, no credentials)
        run: |
          python -c "import min_agent, min_agent.cli"
          python -m min_agent.cli --check-env > /dev/null || true
          python -m min_agent.cli --doctor --skip-broker --quiet || true

      - name: the gate can fail
        run: python tools/verify.py --self-test
