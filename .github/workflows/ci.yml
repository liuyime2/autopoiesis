# Runs the gate a developer runs locally, on every push and pull request.
#
# It can, now. `make verify` used to be broker-dependent, so CI ran only its self-test
# while the file's own first line claimed otherwise. The gate now detects a missing
# broker and a missing runtime directory and runs offline in that case - the same path
# `make smoke`, which really does need a paper account, is not in CI; the credentialed
# path is covered by the watchdog on the deployment host.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `requires-python` is ">=3.10", and only 3.10 had ever been checked in CI - so three
        # versions the project claims to support were never run. 3.10 and 3.12 are run locally;
        # 3.11 is in the matrix because the floor promises it and CI is where that claim is
        # tested, not because it has been verified here. Anything newer than 3.12 is a hypothesis
        # nothing has run, so it is not in the matrix at all rather than in it and allowed to
        # fail - a version listed as permitted-to-fail tells a reader nothing about whether it
        # works.
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      # Full history: `fresh-clone-evidence-real` checks that the commit the committed
      # fresh-clone log tested exists, and a shallow clone holds only the tip.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Every version `requires-python` allows, not just the one this host happens to run.
      # `make check` blocks on mypy and the suite passes on all four locally, but the project
      # only ever proved 3.10 in CI - and `docs/evidence/fresh-clone.log` records 3.13 as the
      # interpreter a fresh clone actually used. A floor of ">=3.10" that is only tested at
      # exactly 3.10 is a claim about three versions nothing checked.
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: lint
        run: ruff check src/ tools/ tests/ examples/

      # `make check` runs mypy and blocks on it; CI did not, so a type regression passed CI
      # and failed the first local `make check` afterwards.
      - name: type check
        run: mypy src/autopoiesis

      - name: unit and integration tests
        run: python -m pytest -q

      - name: offline smoke (no broker, no credentials)
        run: |
          python -c "import autopoiesis, autopoiesis.cli"
          python -m autopoiesis.cli --check-env > /dev/null || true
          python -m autopoiesis.cli --doctor --skip-broker --quiet || true

      - name: the gate can fail
        run: python tools/verify.py --self-test

      - name: the gate itself
        run: python tools/verify.py
